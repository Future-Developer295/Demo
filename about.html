<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Villa Template</title>
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sub-Header / Top Bar -->
  <div class="sub-header">
    <div class="container sub-header-content">
      <div class="contact-info">
        <span><i class="fa-solid fa-envelope"></i> info@company.com</span>
        <span><i class="fa-solid fa-map"></i> Sunny Isles Beach, FL 33160</span>
      </div>
      <div class="social-links">
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
      </div>
    </div>
  </div>

  <!-- Main Navigation Header -->
  <header class="main-header">
    <div class="container header-content">
      <div class="logo">VILLA</div>
      <nav class="nav-menu">
        <a href="#" class="active">Home</a>
        <a href="#">Properties</a>
        <a href="#">Property details</a>
        <a href="#">Contact us</a>
      </nav>
      <a href="#" class="btn-schedule">
        <span class="icon"><i class="fa-solid fa-calendar-days"></i></span>
        <span>Schedule a visit</span>
      </a>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero-section">
    <div class="slider-nav prev"><i class="fa-solid fa-chevron-left"></i></div>
    <div class="slider-nav next"><i class="fa-solid fa-chevron-right"></i></div>
    
    <div class="container">
      <div class="hero-content">
        <div class="badge">Toronto, <span>Canada</span></div>
        <h1>HURRY!<br>GET THE<br>BEST VILLA</h1>
      </div>
    </div>
  </section>

</body>
</html>
